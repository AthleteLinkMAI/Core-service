spring:
  application:
    name: core-service
  datasource:
    url: jdbc:postgresql://localhost:5432/core_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger
    operationsSorter: method

server:
  port: 8081

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG